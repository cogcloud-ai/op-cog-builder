schema: openteams/op-manifest [0.1]
id: openteams/op-cog-builder
version: 0.2.0
name: "Cog Builder \u2014 bounded revisions, two acceptance Gates"
description: Design and accept a pure-code Cog contract, build and review candidates
  within fixed attempt and invocation-cost budgets, and explicitly accept the final
  candidate. Retain every candidate and review.
inputs:
- name: brief
  description: One bounded Cog brief in plain language.
  required: true
  schema:
    type: string
    minLength: 1
  default: Hand-written code fixture for pipeline integration tests, not live authoring
    evidence. Count Unicode code points in a supplied notes string; never interpret
    or execute the notes.
- name: identity
  description: The Smith identity (cog_request v1) the accepted contract is built
    under.
  required: true
  schema:
    type: object
  default:
    cog_request: 1
    name: cog-code-fixture
    id: openteams/cog-code-fixture
    summary: Count characters in supplied notes.
    owner: trent@openteams.com
    license: BSD-3-Clause
    produces: character_count
    prohibits:
    - execute_actions
    - send_external_message
    kind: code
- name: kind
  description: The Cog kind; this slice builds pure-code Cogs only.
  required: false
  schema:
    type: string
    enum:
    - code
  default: code
- name: materials
  description: Supplied source materials (data, never authority), optionally hash-identified.
  required: false
  schema:
    type: array
  default: []
- name: test_criterion_ids
  description: Criterion IDs to which the declared test suite is relevant; evaluator
    must inspect actual coverage.
  required: false
  schema:
    type: array
    items:
      type: string
    uniqueItems: true
  default: []
- name: reference
  description: Optional pinned pure-code reference and authored named-bundle fixture
    path for observed comparison.
  required: false
  default: null
  schema:
    anyOf:
    - type: 'null'
    - type: object
      additionalProperties: false
      required:
      - path
      - package_sha256
      - fixture_path
      - criterion_id
      properties:
        path:
          type: string
          minLength: 1
        package_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        fixture_path:
          type: string
          minLength: 1
        criterion_id:
          type: string
          minLength: 1
- name: max_attempts
  required: false
  default: 3
  description: Maximum build/evidence rounds in a cycle.
  schema:
    type: integer
    minimum: 1
- name: max_cost_units
  required: false
  default: 12
  description: Maximum reserved model-turn units across the cycle; not vendor billing.
  schema:
    type: integer
    minimum: 0
- name: revision_paths
  required: false
  default:
  - src/task_logic.py
  - tests/test_cog.py
  description: Only these author-owned files may change during automatic repair.
  schema:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
- name: execution_policy
  required: false
  default:
    mode: trusted-local
  description: Explicit verifier policy; Docker mode requires a pinned local image.
  schema:
    type: object
- name: build_origin
  required: false
  default: null
  description: Optional stable designer proposal/missing-Cog identity, retained in
    candidate acceptance.
  schema:
    anyOf:
    - type: 'null'
    - type: object
      additionalProperties: false
      required:
      - proposal_sha256
      - missing_cog_id
      properties:
        proposal_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        missing_cog_id:
          type: string
          pattern: ^missing-[a-f0-9]{64}$
steps:
- id: design
  name: Design the contract
  cog:
    id: openteams/cog-author
    version: 0.1.0
    source: ../cog-author
    task: ask-composed
  depends_on: []
  input:
    operation: design
    brief:
      $from: inputs.brief
    contract: null
    identity:
      $from: inputs.identity
    materials:
      $from: inputs.materials
    feedback: []
    kind:
      $from: inputs.kind
  expected_outcome: A complete work contract for the brief, or questions (which fail
    this Gate by name, since nothing is decidable).
  gate:
    policy: human
    decides: artifact
    artifact:
      kind: cog-contract
      id:
        $from: inputs.identity.id
      summary:
        $from: steps.design.payload.contract.purpose
        $default: ''
      detail:
        classification:
          $from: steps.design.payload.classification
        questions:
          $from: steps.design.payload.questions
          $default: []
        assumptions:
          $from: steps.design.payload.assumptions
          $default: []
        acceptance_criteria:
          $from: steps.design.payload.contract.acceptance_criteria
          $default: []
      digests:
        contract:
          $sha256:
            $from: steps.design.payload.contract
        identity:
          $sha256:
            $from: inputs.identity
  on_fail: stop
- id: author
  name: Author
  cog:
    id: openteams/cog-author
    version: 0.1.0
    source: ../cog-author
    task: ask-composed
  depends_on:
  - design
  input:
    operation: author
    brief:
      $from: inputs.brief
    contract:
      $from: steps.design.payload.contract
    identity:
      $from: inputs.identity
    materials:
      $from: inputs.materials
    feedback: []
    kind:
      $from: inputs.kind
    contract_sha256:
      $from: steps.design.decision.artifact.digests.contract
  expected_outcome: Complete source preserving the accepted contract.
  gate:
    policy: envelope-ok-no-error-problems
    guards: []
  on_fail: stop
- id: materialize
  name: Materialize
  cog:
    id: openteams/cog-build-candidate
    version: 0.1.0
    source: ../cog-build-candidate
    task: run
  depends_on:
  - design
  - author
  input:
    author_request:
      operation: author
      brief:
        $from: inputs.brief
      contract:
        $from: steps.design.payload.contract
      identity:
        $from: inputs.identity
      materials:
        $from: inputs.materials
      feedback: []
      kind:
        $from: inputs.kind
      contract_sha256:
        $from: steps.design.decision.artifact.digests.contract
    author_envelope:
      $from: steps.author.envelope
    accepted_contract_sha256:
      $from: steps.design.decision.artifact.digests.contract
    output_dir:
      $run_dir: candidate
  expected_outcome: Checked full package and expanded snapshot.
  gate:
    policy: envelope-ok-no-error-problems
    guards: []
  on_fail: stop
- id: plan
  name: Plan
  cog:
    id: openteams/cog-build-evaluator
    version: 0.1.0
    source: ../cog-build-evaluator
    task: ask-composed
  depends_on:
  - materialize
  input:
    $from: steps.materialize.payload.plan_request
  expected_outcome: Concrete evaluation plan for the expanded candidate.
  gate:
    policy: envelope-ok-no-error-problems
    guards: []
  on_fail: stop
- id: verify
  name: Verify
  cog:
    id: openteams/cog-verify-candidate
    version: 0.1.0
    source: ../cog-verify-candidate
    task: run
  depends_on:
  - design
  - author
  - materialize
  - plan
  input:
    author_request:
      operation: author
      brief:
        $from: inputs.brief
      contract:
        $from: steps.design.payload.contract
      identity:
        $from: inputs.identity
      materials:
        $from: inputs.materials
      feedback: []
      kind:
        $from: inputs.kind
      contract_sha256:
        $from: steps.design.decision.artifact.digests.contract
    author_envelope:
      $from: steps.author.envelope
    materialized:
      $from: steps.materialize.payload
    plan_envelope:
      $from: steps.plan.envelope
    execution_policy:
      $from: inputs.execution_policy
    test_criterion_ids:
      $from: inputs.test_criterion_ids
    reference:
      $from: inputs.reference
  expected_outcome: Actual declared tests and planned-case observations.
  gate:
    policy: envelope-ok-no-error-problems
    guards: []
  on_fail: stop
- id: review
  name: Review
  cog:
    id: openteams/cog-build-evaluator
    version: 0.1.0
    source: ../cog-build-evaluator
    task: ask-composed
  depends_on:
  - verify
  input:
    $from: steps.verify.payload.review_request
  expected_outcome: Grounded assessment; completion is review, not acceptance.
  gate:
    policy: human
    decides: artifact
    artifact:
      kind: cog-candidate
      id:
        $from: inputs.identity.id
      summary:
        $from: steps.review.payload.reason
      detail:
        classification:
          $from: steps.review.payload.classification
        candidate_path:
          $from: steps.materialize.payload.path
        declared_tests_exit_code:
          $from: steps.verify.payload.tests.exit_code
        findings:
          $from: steps.review.payload.findings
          $default: []
        build_origin:
          $from: inputs.build_origin
      digests:
        contract:
          $from: steps.design.decision.artifact.digests.contract
        source:
          $from: steps.materialize.payload.source_sha256
        package:
          $from: steps.verify.payload.package_sha256
        evidence:
          $sha256:
            $from: steps.verify.payload
        assessment:
          $sha256:
            $from: steps.review.payload
  on_fail: stop
outputs:
  contract:
    $from: steps.design.payload.contract
  contract_sha256:
    $from: steps.design.decision.artifact.digests.contract
  contract_accepted_by:
    $from: steps.design.decision.decided_by
  candidate_path:
    $from: steps.materialize.payload.path
  source_sha256:
    $from: steps.materialize.payload.source_sha256
  package_sha256:
    $from: steps.verify.payload.package_sha256
  assessment:
    $from: steps.review.payload
  tests:
    $from: steps.verify.payload.tests
  acceptance:
    $from: steps.review.decision.verdict
  accepted_by:
    $from: steps.review.decision.decided_by
  accepted_artifact_sha256:
    $from: steps.review.decision.artifact_sha256
track:
  records:
  - input_request
  - step_requests
  - cog_envelopes
  - contract_check_problems
  - gate_decisions
  - model_bindings
  - output_artifacts
cycle:
  outcome_step: review
  outcome_field: classification
  max_attempts:
    $from: inputs.max_attempts
  max_cost_units:
    $from: inputs.max_cost_units
  costs:
    design: 1
    author: 1
    materialize: 0
    plan: 1
    verify: 0
    review: 1
    revision-request: 0
  transitions:
    revise:
      restart: author
      prepare:
      - id: revision-request
        name: Prepare candidate-bound revision request
        cog:
          id: openteams/cog-author
          version: 0.1.0
          source: ../cog-author
          task: prepare-revision
        input:
          author_request:
            $from: inputs.cycle_previous.steps.author.request
          author_envelope:
            $from: inputs.cycle_previous.steps.author.envelope
          review_request:
            $from: inputs.cycle_previous.steps.verify.payload.review_request
          review_envelope:
            $from: inputs.cycle_previous.steps.review.envelope
          allowed_change_scope:
            paths:
              $from: inputs.revision_paths
        expected_outcome: Exact prior source, immutable accepted contract and candidate-bound
          review in a scoped revision receipt.
        gate:
          policy: envelope-ok-no-error-problems
          guards: []
        on_fail: stop
      replace:
        author:
          input:
            $from: steps.revision-request.payload.request
          depends_on:
          - design
          - revision-request
        materialize:
          input:
            author_request:
              $from: steps.revision-request.payload.request
            author_envelope:
              $from: steps.author.envelope
            accepted_contract_sha256:
              $from: steps.design.decision.artifact.digests.contract
            output_dir:
              $run_dir: candidate
          depends_on:
          - design
          - author
          - revision-request
        verify:
          input:
            author_request:
              $from: steps.revision-request.payload.request
            author_envelope:
              $from: steps.author.envelope
            materialized:
              $from: steps.materialize.payload
            plan_envelope:
              $from: steps.plan.envelope
            test_criterion_ids:
              $from: inputs.test_criterion_ids
            reference:
              $from: inputs.reference
          depends_on:
          - design
          - author
          - materialize
          - plan
          - revision-request
    insufficient_evidence:
      restart: plan
      replace:
        verify:
          input:
            author_request:
              $from: inputs.cycle_previous.steps.verify.request.author_request
            author_envelope:
              $from: steps.author.envelope
            materialized:
              $from: steps.materialize.payload
            plan_envelope:
              $from: steps.plan.envelope
            test_criterion_ids:
              $from: inputs.test_criterion_ids
            reference:
              $from: inputs.reference
